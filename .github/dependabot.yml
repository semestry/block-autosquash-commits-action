version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
    groups:
      actions:
        patterns:
          - "@actions/*"
