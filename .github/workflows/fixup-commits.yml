name: Block on fixup commits

on: pull_request

permissions:
  pull-requests: read

jobs:
  message:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
